version: 1

project:
  title: Machine Learning con Python
  description: Curso de Machine Learning con Python
  github: https://github.com/vmoprojs/MLPython
  bibliography:
    - references.bib
  toc:
    - file: intro.md

    - title: Parte I. Fundamentos computacionales
      children:
        - file: IntroduccionPython.ipynb
        - file: Pandas.ipynb
        - file: Visualizacion.ipynb

    - title: Parte II. Fundamentos matemáticos y estadísticos
      children:
        - file: Descriptiva.ipynb
        - file: PruebasHipotesis.ipynb

    - title: Parte III. Fundamentos y evaluación de Machine Learning
      children:
        - file: IntroML.ipynb
        - file: Evaluacion.ipynb

    - title: Parte IV. Aprendizaje supervisado
      children:
        - file: AprendizajeSupervisado.ipynb
        - file: Regresion.ipynb
        - file: StepRegularization.ipynb
        - file: ProbModels.ipynb
        - file: Arboles.ipynb
        - file: SVM.ipynb

    - title: Parte V. Aprendizaje no supervisado
      children:
        - file: ACP.ipynb
        - file: NoSupervizado.ipynb

    - title: Parte VI. Redes neuronales y aprendizaje profundo
      children:
        - file: RedesNeuronales.ipynb
        - file: AprendizajeProfundo.ipynb

    - title: Parte VII. Descubrimiento de patrones
      children:
        - file: ReglasAso.ipynb
        

  settings:
    output_matplotlib_strings: remove
    output_stderr: remove-warn
    parser:
      dollarmath: true

sphinx:
  config:
    bibtex_reference_style: author_year

site:
  template: book-theme
  options:
    logo: logo.jpg
    favicon: logo.jpg
    folders: true
    actions:
      - title: Repository
        url: https://github.com/vmoprojs/MLPython
        icon: github
      - title: Issues
        url: https://github.com/vmoprojs/MLPython/issues
        icon: github
      - title: Open in Colab
        url: https://colab.research.google.com/github/vmoprojs/MLPython/blob/main/MLPython/intro.md
        icon: play
      - title: Launch Binder
        url: https://mybinder.org/v2/gh/vmoprojs/MLPython/main?labpath=MLPython
        icon: rocket
